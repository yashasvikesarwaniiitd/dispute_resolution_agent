# Investigation evaluation - cases v1 (ADR 0072). Draft for owner review, 2026-11-27.
#
# What is graded: one decision point of the investigation agent, as in the Decision Quality set
# (evals/decision_quality/golden_v1.yaml), plus HOW it got there: whether it looked at what the
# case needs, how many tools it called, and whether it contacted the seller or the hub when the
# evidence made that unnecessary. Kept separate from the end-to-end regression suite and the
# 18-point Decision Quality set; to be mapped onto the 60-scenario candidate agentic set when
# that set is provided.
#
# The agent never sees this file (nothing under src/ reads evals/). Trajectories are NOT
# prescribed: `must_consult` names information, not tool order, and any order that reaches it
# within `max_tool_calls` is fine.
#
# Per case:
#   category        zero_tool | single_tool | refined_query | multi_tool | conflicting | unresolvable
#   shipment        a generated dispute row (config/sellers/generated/), measured inside the
#                   variation it needs; `fixture` is that row's fixture name
#   script          the replay before the graded round (scenario-runner tokens); round 1 = raised only
#   acceptable      actions a good investigator could take here
#   safe_fallback   escalate_to_human where a clear action exists (safe, not credited as good)
#   prohibited      unsafe here, counted even when policy blocks it
#   must_mention    concerns the decision must record: a phrase, or a list of equivalent phrasings
#   must_consult    information the decision should rest on; any_of = at least one, all_of = each
#                   (sources: scanner_statistics, past_shipments, past_disputes, photo, policy,
#                    briefing - the upfront evidence alone)
#   max_tool_calls  more than this counts as over-investigation (the hard cap is 5 per round)
#   contacts        whether asking the hub or the seller is necessary, unnecessary or acceptable
#                   here; an "unnecessary" one counts against the contact-reduction target
#   v3_expected     what the existing workflow is expected to do here (to be measured, not assumed)
#   data            the planted variation this case needs (the generator's requirement)

version: 1
status: draft
grader: "tests/evals/investigation (scripted: plumbing and safeguards); paid model runs only with owner approval"

cases:

  # --- Zero-tool: the upfront evidence decides --------------------------------------------------

  - id: IC-01
    category: zero_tool
    shipment: SHP-104901
    fixture: inv_kh_vase_calc_error
    round: 1
    script: [dispute_raised@0h]
    situation: Billed one slab more than the rate card gives for the hub's own measurement. The seller's note also complains the pickup was two days late and the box arrived dented.
    acceptable: [propose_credit]
    safe_fallback: [escalate_to_human]
    prohibited: [uphold_charge, wait]
    credit: {allowed: true, reason: calculation_error}
    must_consult: {any_of: [briefing]}
    # The seller's other concerns, recorded in findings; each in any of its equivalent phrasings.
    must_mention: [[late pickup, picked up late, pickup delay], [dented box, dent, damaged box, damage]]
    max_tool_calls: 0
    contacts: {hub: unnecessary, seller: unnecessary}
    v3_expected: propose_credit
    data: proven calculation_error; measured matches declared; statement with two extra concerns

