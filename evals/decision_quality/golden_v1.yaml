# Decision Quality - golden dataset v1. Approved by the owner on 2026-11-25.
#
# What is graded: the agent's decision at one decision point - the next step it proposes from
# code's menu, given the evidence it had at that moment. Every round is a decision point, not
# only the first: the hub's or the seller's reply starts a new one.
#
# The answer key. The agent never sees this file: nothing under src/ may read evals/, and the
# labels are an owner's judgement of what a good investigator should do, made independently
# of what the rules baseline or the model chose. Agreement with the rules is not correctness.
#
# Per decision point:
#   acceptable     - actions a good investigator could take here
#   safe_fallback  - "a person should look" - safe but not credited as a good decision when a
#                    clear action exists (otherwise escalating everything would score well)
#   prohibited     - unsafe or harmful here; counted even when policy blocks it
#   (anything else on the menu is "not acceptable": a weak decision, not an unsafe one)
#   credit         - whether a credit may be proposed, for which proven error, and how much
#   must_rest_on   - the evidence a sound explanation rests on (for the LLM judge, later)
#   must_not_claim - claims the evidence does not support (for the LLM judge, later)
#   owner_decided  - a label the owner settled at approval, and how
#   fixture_status - "exists" (replayable today) or "new" (step 2 adds it to the findings bank)
#
# Menu: propose_credit, uphold_charge, request_remeasurement, request_seller_evidence,
#       escalate_to_human, wait. Money: rate card zone B INR 38 per 0.5 kg slab.

version: 1
status: approved
