    faults: {evidence.shipment_status: unavailable}   # down before the first gather round
    script: [dispute_raised@0h]
    expect:
      actions: n/a  # the case never reaches INVESTIGATING
      baseline: n/a   # INVESTIGATING is never reached
      path: [RECEIVED, NEEDS_HUMAN_REVIEW]
      final: NEEDS_HUMAN_REVIEW
      review: module_unavailable:evidence
      counts: {emails_sent: 0}
      notes: >-
        the eligibility step declares three outcomes (transitions.yaml steps.eligibility):
        passed, failed and escalate. This is the escalate branch, and the only scenario for it.
        The agent cannot prove the shipment delivered or not delivered, and eligibility decides
        whether the case may proceed at all, so guessing either way is unsafe (I6). Contrast
        S05b, where eligibility succeeds and the evidence module is missing one round later.
    invariants: [I6, I4]

# Every scenario additionally runs with sentinel secret values in settings and sentinel strings
# in all untrusted text; after the run, the database, logs, spans and fixtures are scanned for
# the secret sentinels (I12, TC-SEC-01) and spans and model_calls for the content sentinels (I14).
global_checks: [I12_sentinel_scan, I14_content_scan, I8_state_changed_matches_rows, no_unauthorised_credit, no_duplicate_side_effect]
