# Evaluation scenarios (Stage A4). Status: draft for owner approval.
#
# Each scenario is a scripted run against fakes and the simulated ledger with a fake clock
# (Phase 6 runs all of them; earlier phases run the ones whose `phase` they reach). Live-model
# runs (Phase 4 / 4b evals) replay the same scenarios with the real reasoner and compare with
# the expected action. Fixtures are defined in docs/spec/synthetic-data.md.
#
# Pilot configuration applies (D6): every message kind needs approval, so every message step
# passes AWAITING_APPROVAL. Approvals in a scenario are scripted APPROVAL_DECIDED events.
#
# Fields:
#   title            one line, human-readable
#   flow8            the FLOW.md section 8 requirement this satisfies, if any
#   phase            first phase that can run it
#   fixture          synthetic-data.md fixture id
#   config           configuration overrides for this run (dotted keys)
#   faults           adapter fault injection (integrations.md, money-rules.md section 7)
#   script           inbound events in order (t = fake-clock offset)
#   expect.actions   proposal actions expected, in order (the reasoner's job). `n/a` plus a reason
#                    means no proposal is produced at all; such scenarios are excluded from the
#                    correct_action_rate denominator deliberately, not by accident.
#   expect.baseline  what the rules-only table (agent-design.md section 5) produces for the FIRST
#                    round: `same` = identical to expect.actions[0], an action name = that action,
#                    `n/a` plus a reason = INVESTIGATING is never reached. Every scenario carries
#                    one, because no_regression_vs_baseline compares against it per round.
#   expect.path      exact state sequence (transitions.yaml), including repeats
#   expect.path_suffix    the tail of the sequence, when the head is another scenario's script
#   expect.path_contains  states that must appear in this order, when the full path is config-dependent
#   expect.final     the state the case is in when the script ends. A terminal state is an outcome;
#                    a `waiting` state (AWAITING_SELLER, AWAITING_OPS, AWAITING_APPROVAL) means the
#                    scenario deliberately stops mid-flight and contributes no final outcome.
#   expect.review    review code when the case is in NEEDS_HUMAN_REVIEW at the end
#   expect.review_on_first_stop  review code at the FIRST time the case reaches NEEDS_HUMAN_REVIEW,
#                    for scenarios that then move on
#   expect.counts    side-effect counts the run must end with (the hard-gate checks)
#   expect.notes     what the scenario is really testing, in words
#   invariants       what it exercises
#   decision         owner decision that fixed a debatable outcome (D-number), if any
#
# Transition coverage. A verifier walks every declared path against transitions.yaml; at the
# time of writing 281 consecutive state pairs across 59 scenarios are legal and 45 of the 50
# edges are walked. The five that are not:
#   T23 (credit -> confirmation without a separate approval), T28 (reminder sent without
#     approval) and T35 (hand-off notice sent without approval) are unreachable while the pilot
#     reviews every message kind (D6). They become reachable in Phase 6 when the owner relaxes
#     review (O7), and the same scenarios cover them with policy.messages.review_kinds reduced.
#     They are not dead transitions, and no scenario fakes them.
#   T37 (a person returns the case) is exercised by S12b and S19, which declare path_contains
#     rather than an exact path because the full sequence depends on configuration. The edge is
#     covered; an adjacency checker simply cannot see it.
#   T90 from GATHERING_EVIDENCE has no scenario. Every evidence failure the specs describe ends
#     as a FAILED evidence item that the assess or investigate step then acts on (orchestrator.md
#     section 5), so nothing in the current design reaches the gather_evidence escalate branch.
#     Either a cause exists that is not yet written down, or the branch is unreachable and should
#     be removed. Resolve it in Phase 1, when the step is implemented -- do not invent a scenario
#     for it here.

version: 1

scenarios:

  - id: S01
    title: Provable calculation error is credited (wrong slab billed)
    flow8: provable calculation error
    phase: 5
    fixture: calc_error_wrong_slab
    script: [dispute_raised@0h, approve(credit)@1h, approve(credit_confirmation)@2h]
    expect:
      actions: [propose_credit]
      baseline: same   # B3: definite error calculation_error, no live credit
      path: [RECEIVED, GATHERING_EVIDENCE, CALCULATING, INVESTIGATING, AWAITING_APPROVAL, EXECUTING,
             VERIFYING, AWAITING_APPROVAL, EXECUTING, VERIFYING, RESOLVED_CREDITED]
      final: RESOLVED_CREDITED
      counts: {ledger_credits: 1, emails_sent: 1, approvals: 2}
      notes: credit amount = charged - recalculated exactly; the confirmation cites credited_amount
    invariants: [I3, I8, I9, I13]

