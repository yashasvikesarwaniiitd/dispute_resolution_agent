name: seller_message_drafter
version: v1
status: active
owner: product
purpose: Draft a seller message from approved facts only. Code validates every number before sending and a person reviews every message in the pilot.
output_schema: schema.json
model_requirements:
  structured_output: true
  tool_use: none
max_output_tokens: 700
eval_suite: tests/evals/seller_message_drafter
eval_cases: docs/spec/prompt-review.md#seller_message_drafter
changelog:
  - v1: initial version
  - v1 (pre-release edit, 2026-11-02): added the reminder and clarification_request kinds (owner decision D19). Edited in place because v1 has never been released or run.
  - v1 (pre-release edit, 2026-11-02, Stage A4 adversarial review): per-kind purpose table; facts carry a kind (identifier facts need no numbers_used entry, matching rule R09); digits only, never number words (residual RR1); never write an address, link or phone number; clarification open points arrive in an untrusted_ block; credit_confirmation must use credited_amount or block; examples for credit confirmation and a blocked draft; temperature removed. Failure modes MD-F1..MD-F8 in docs/spec/prompt-review.md.
