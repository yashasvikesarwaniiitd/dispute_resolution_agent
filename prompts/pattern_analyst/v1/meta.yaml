name: pattern_analyst
version: v1
status: inactive
owner: product
purpose: Turn code-produced cluster statistics into competing hypotheses and one investigation request. Hypotheses only; never actions.
activation: Phase 7. Set status to active only after its eval suite passes.
output_schema: schema.json
model_requirements:
  structured_output: true
  tool_use: none
max_output_tokens: 1200
eval_suite: tests/evals/pattern_analyst
eval_cases: docs/spec/prompt-review.md#pattern_analyst
changelog:
  - v1: initial version, inactive until Phase 7
  - v1 (pre-release edit, 2026-11-02, Stage A4 adversarial review): identifiers never the subject of a fault hypothesis; correlation-not-cause and no-circular-confirmation rules; temperature removed. Failure modes PA-F1..PA-F4 in docs/spec/prompt-review.md.
  - v1 (pre-release edit, 2026-11-03, Stage A4 independent review): numbers and examples sections added (prompts/README section structure), including one manipulation attempt; untrusted_case_notes added to inputs and the template, so the trust-model and rules clauses about untrusted_ blocks now govern a block that actually exists. Finding B11-minor in docs/spec/a4-review-findings.md.
  - v1 (pre-release edit, 2026-11-04, Phase 7 P7-04): the two examples now match schema.json (kind vocabulary, confirm_with / refute_with / owner_team, the required limits, an investigation_request object in both) and use only numbers from cluster_stats. As written they could not validate, so a model copying them would always fail the output checks.
