name: case_explainer
version: v2
status: active  # live check passed 3 of 3, 2026-11-24 (ADR 0039)
owner: product
purpose: Explain a case to a human reviewer from read-only tools. Never decides, never acts.
output_schema: none  # plain text for a person; the tools, not a schema, bound what it can do
model_requirements:
  structured_output: false
  tool_use: read_only_custom_tools
max_output_tokens: 1200
runtime: claude_agent_sdk  # ADR 0039; Haiku only (I14 exception, read-only)
eval_suite: tests/unit/modules/reasoning/test_case_explainer.py (offline) and scripts/explain.py --check (live)
changelog:
  - "v2: brief and structured for the Review screen's chat (ADR 0058): one direct sentence, then 2 to 4 labelled lines with a source each, under 80 words, dates not timestamps."
  - "v2 activated 2026-11-24: `make explain ARGS=--check` passed 3 of 3 on Haiku, every answer one line plus 3 to 4 labelled points with sources, USD 0.0026."
