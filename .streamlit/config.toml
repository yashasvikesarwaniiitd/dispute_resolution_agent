# The operations console's theme (ADR 0044): Hallmark's Coral material, app-screen scope.
# Warm grey paper, near-black ink, ink-board primary controls. Coral is not a theme colour:
# it is spent only on the settled (credited) state and focus, in src/dispute_agent/ui/theme.py.
# Values are Coral's OKLCH tokens converted to sRGB hex.

[theme]
base = "light"
primaryColor = "#1f1917"
backgroundColor = "#f8f4f1"
secondaryBackgroundColor = "#f1ece8"
textColor = "#1d1614"
linkColor = "#bb3d31"
borderColor = "#d9d3cf"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "General Sans:https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap, sans-serif"
headingFont = "General Sans:https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap, monospace"
baseFontSize = 16
showSidebarBorder = true

[client]
toolbarMode = "minimal"

[server]
headless = true
# No address here: the hosted console must listen where its host says. `make run-console`
# passes --server.address 127.0.0.1 so the local one stays on loopback (threat T09).

[browser]
gatherUsageStats = false
