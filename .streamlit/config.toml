# The operations console's theme (ADR 0044): the Dispute Desk v2 design handoff, section 6.
# Warm grey paper, near-black ink, ink primary controls, white sheets with fine borders.
# Meaning colours (green = proven by code, violet = AI, blue = you, teal = hub, amber = caution,
# red = failed) are not theme colours: they live in src/dispute_agent/ui/assets/console.css.

[theme]
base = "light"
primaryColor = "#17191e"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#f1efea"
textColor = "#17191e"
linkColor = "#2d55c8"
borderColor = "#d9d6ce"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
# Geist for text; Source Sans 3 (tabular digits) for amounts, ids and text shown as recorded.
# The design uses no monospace: recorded text is set in the numbers font.
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "Source Sans 3:https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap, sans-serif"
baseFontSize = 14
showSidebarBorder = true

[client]
toolbarMode = "minimal"

[server]
headless = true
# The only upload is a parcel photo on Add a shipment (ADR 0056), which accepts 5 MB; the
# uploader states this limit, so it must match the one the store enforces.
maxUploadSize = 5
# No address here: the hosted console must listen where its host says. `make run-console`
# passes --server.address 127.0.0.1 so the local one stays on loopback (threat T09).

[browser]
gatherUsageStats = false
