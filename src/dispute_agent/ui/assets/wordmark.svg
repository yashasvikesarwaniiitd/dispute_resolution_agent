<svg xmlns="http://www.w3.org/2000/svg" width="140" height="24" viewBox="0 0 140 24" role="img" aria-label="Dispute Desk">
  <!-- The console's name in the top bar (design v2, 2.1): an ink square holding a white bar, then
       the name. An image, because Streamlit's logo slot takes no CSS; ink is the theme's #17191e. -->
  <rect x="0" y="2" width="20" height="20" rx="5" fill="#17191e"/>
  <rect x="4" y="11" width="12" height="2" fill="#ffffff"/>
  <text x="28" y="17" fill="#17191e" font-family="Geist, ui-sans-serif, system-ui, 'Segoe UI', sans-serif"
        font-size="15" font-weight="700">Dispute Desk</text>
</svg>
